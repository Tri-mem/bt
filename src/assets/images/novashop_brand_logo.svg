<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Slate-Obsidian Canvas -->
    <linearGradient id="nsCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <!-- Wing 1: Top — Electric Cobalt to Sky Cyan -->
    <linearGradient id="nsWingBlue" x1="18%" y1="35%" x2="78%" y2="20%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="nsFoldBlue" x1="20%" y1="25%" x2="65%" y2="50%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Wing 2: Bottom-Right — Warm Amber Gold to Sunset Coral -->
    <linearGradient id="nsWingAmber" x1="18%" y1="35%" x2="78%" y2="20%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="nsFoldAmber" x1="20%" y1="25%" x2="65%" y2="50%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <!-- Wing 3: Bottom-Left — Emerald Teal to Royal Indigo -->
    <linearGradient id="nsWingTeal" x1="18%" y1="35%" x2="78%" y2="20%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="nsFoldTeal" x1="20%" y1="25%" x2="65%" y2="50%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Central Optical Sphere Core -->
    <radialGradient id="nsCenterCore" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="100" height="100" rx="23" fill="url(#nsCanvas)" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="21.5" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Wing 1 (0 deg) -->
  <g>
    <path d="M 50 34.5 L 25.5 33.2 C 20.5 32.9 18.8 27.2 22.8 23.8 L 43.5 13.2 C 47.6 11.1 52.4 11.1 56.5 13.2 L 73.2 21.8 C 77.4 24.0 78.2 29.2 75.0 33.6 L 61.5 52.2 C 59.8 54.5 56.5 53.2 56.8 50.2 L 58.0 40.5 C 58.3 37.2 55.2 34.8 50 34.5 Z" fill="url(#nsWingBlue)" />
    <path d="M 50 34.5 L 25.5 33.2 C 22.2 33.0 20.8 29.8 22.5 27.2 L 54.5 30.2 C 57.5 30.5 59.2 33.2 58.0 40.5 L 56.8 50.2 C 56.5 53.2 59.8 54.5 61.5 52.2 L 54.0 42.0 C 52.5 39.8 51.2 36.2 50 34.5 Z" fill="url(#nsFoldBlue)" opacity="0.75" />
  </g>

  <!-- Wing 2 (120 deg) -->
  <g transform="rotate(120 50 50)">
    <path d="M 50 34.5 L 25.5 33.2 C 20.5 32.9 18.8 27.2 22.8 23.8 L 43.5 13.2 C 47.6 11.1 52.4 11.1 56.5 13.2 L 73.2 21.8 C 77.4 24.0 78.2 29.2 75.0 33.6 L 61.5 52.2 C 59.8 54.5 56.5 53.2 56.8 50.2 L 58.0 40.5 C 58.3 37.2 55.2 34.8 50 34.5 Z" fill="url(#nsWingAmber)" />
    <path d="M 50 34.5 L 25.5 33.2 C 22.2 33.0 20.8 29.8 22.5 27.2 L 54.5 30.2 C 57.5 30.5 59.2 33.2 58.0 40.5 L 56.8 50.2 C 56.5 53.2 59.8 54.5 61.5 52.2 L 54.0 42.0 C 52.5 39.8 51.2 36.2 50 34.5 Z" fill="url(#nsFoldAmber)" opacity="0.75" />
  </g>

  <!-- Wing 3 (240 deg) -->
  <g transform="rotate(240 50 50)">
    <path d="M 50 34.5 L 25.5 33.2 C 20.5 32.9 18.8 27.2 22.8 23.8 L 43.5 13.2 C 47.6 11.1 52.4 11.1 56.5 13.2 L 73.2 21.8 C 77.4 24.0 78.2 29.2 75.0 33.6 L 61.5 52.2 C 59.8 54.5 56.5 53.2 56.8 50.2 L 58.0 40.5 C 58.3 37.2 55.2 34.8 50 34.5 Z" fill="url(#nsWingTeal)" />
    <path d="M 50 34.5 L 25.5 33.2 C 22.2 33.0 20.8 29.8 22.5 27.2 L 54.5 30.2 C 57.5 30.5 59.2 33.2 58.0 40.5 L 56.8 50.2 C 56.5 53.2 59.8 54.5 61.5 52.2 L 54.0 42.0 C 52.5 39.8 51.2 36.2 50 34.5 Z" fill="url(#nsFoldTeal)" opacity="0.75" />
  </g>

  <!-- Central Floating Optical Lens Core -->
  <circle cx="50" cy="50" r="8.2" fill="url(#nsCenterCore)" />
  <circle cx="47.8" cy="47.8" r="2.4" fill="#FFFFFF" />
</svg>
